    <!-- ONE-TIME SERVICE WORKER NUKE: Runs before any SW can intercept.
         This forces all stuck PWA clients to unregister old SWs and delete
         stale caches, allowing the new SW with auto-update to take over.
         After this runs once, the 'mtxtrkr_sw_nuked' flag prevents re-runs. -->
    <script>
      (function() {
        try {
          if (localStorage.getItem('mtxtrkr_sw_nuked')) return;

          // Nuke all service workers
          if (navigator.serviceWorker) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              regs.forEach(function(reg) { reg.unregister(); });
            });
          }

          // Nuke all caches
          if (window.caches) {
            caches.keys().then(function(keys) {
              keys.forEach(function(key) { caches.delete(key); });
            });
          }

          // Mark as nuked so this only runs once
          localStorage.setItem('mtxtrkr_sw_nuked', 'true');

          // If an old SW was active, show a brief non-blocking toast
          if (navigator.serviceWorker && navigator.serviceWorker.controller) {
            var toast = document.createElement('div');
            toast.style.cssText = 'position:fixed;bottom:20px;right:20px;background:#1e293b;color:#e2e8f0;padding:12px 20px;border-radius:12px;z-index:99999;font-family:system-ui,sans-serif;font-size:14px;box-shadow:0 4px 20px rgba(0,0,0,0.5);border:1px solid #334155;opacity:0;transition:opacity 0.3s;max-width:320px;';
            toast.textContent = 'App updated — refresh for the latest version.';
            document.body.appendChild(toast);
            requestAnimationFrame(function() { toast.style.opacity = '1'; });
            setTimeout(function() {
              toast.style.opacity = '0';
              setTimeout(function() { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 300);
            }, 4000);
          }
        } catch(e) {
          console.warn('[SW Nuke] Error:', e);
        }
      })();
    </script>

    <!-- Premium Activation via URL (runs before React loads) -->
    <script>
      (function() {
        var params = new URLSearchParams(window.location.search);
        if (params.get('activate') === 'premium') {
          try {
            // Set immediately
            localStorage.setItem('mtxtrkr_premium_status', 'true');
            // Keep re-setting for 10 seconds to survive sync overrides from old code
            var retries = 0;
            var interval = setInterval(function() {
              localStorage.setItem('mtxtrkr_premium_status', 'true');
              retries++;
              if (retries > 20) clearInterval(interval);
            }, 500);
            // Clean URL
            window.history.replaceState({}, '', window.location.pathname);
          } catch(e) {
            console.warn('[Premium] Could not set localStorage:', e);
          }
        }
        if (params.get('restore-premium') === '1') {
          try {
            // Set premium status AND subscription data so the stale-premium
            // cleanup effect doesn't wipe these on the next auth change.
            localStorage.setItem('mtxtrkr_premium_status', 'true');
            localStorage.setItem('mtxtrkr_subscription_status', 'active');
            localStorage.setItem('mtxtrkr_subscription_plan', 'monthly');
            // Keep re-setting for 10 seconds to survive sync overrides from old code
            var retries2 = 0;
            var interval2 = setInterval(function() {
              localStorage.setItem('mtxtrkr_premium_status', 'true');
              localStorage.setItem('mtxtrkr_subscription_status', 'active');
              retries2++;
              if (retries2 > 20) clearInterval(interval2);
            }, 500);
            // NOTE: Do NOT clean the URL here — let the React handler in App.jsx
            // clean it after confirming the Supabase upsert succeeds.
          } catch(e) {
            console.warn('[RestorePremium] Could not set localStorage:', e);
          }
        }
      })();
    </script>

    <!-- Service Worker Registration with Auto-Update Detection -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('[SW] Registered successfully:', reg.scope);
              
              // Check for updates immediately (overrides browser's 24h throttle)
              reg.update();
              
              // Listen for a new SW waiting to activate
              reg.addEventListener('updatefound', () => {
                const newSW = reg.installing;
                console.log('[SW] New version detected, waiting for install...');
                
                newSW.addEventListener('statechange', () => {
                  if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
                    // New SW is installed and waiting — force activate
                    console.log('[SW] New version installed, reloading...');
                    newSW.postMessage({ action: 'skipWaiting' });
                  }
                });
              });
            })
            .catch((err) => {
              console.warn('[SW] Registration failed:', err);
            });
            
          // When a new SW takes control, reload the page to use fresh assets
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            console.log('[SW] New controller activated, reloading...');
            window.location.reload();
          });
        });
        
        // Periodically check for SW updates (every 5 minutes)
        setInterval(() => {
          navigator.serviceWorker.getRegistration().then((reg) => {
            if (reg) {
              reg.update();
              console.log('[SW] Periodic update check');
            }
          });
        }, 5 * 60 * 1000);
      }
    </script>
